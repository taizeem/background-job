name: CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-test:
    name: Lint, Schema Validation & Pytest (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: job_platform_dev
          POSTGRES_USER: job_user
          POSTGRES_PASSWORD: job_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_user -d job_platform_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-used-in-production
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DB_NAME: job_platform_dev
      DB_USER: job_user
      DB_PASSWORD: job_password
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Validate OpenAPI 3.0 Schema
        run: uv run python manage.py spectacular --validate --file schema.yaml

      - name: Run Automated Test Suite with Coverage Gate
        run: uv run pytest --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=85